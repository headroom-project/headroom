name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI runs wherever a customer's pipeline runs, so it is tested on
        # all three rather than on the one that is cheapest.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go mod verify
        run: go mod verify

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # A release that does not compile for a platform is a release nobody can
      # install there, and finding that out at tag time is finding out too late.
      - name: build every release target
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/headroom
            echo "ok $target"
          done

      # The browser build is behind a `js && wasm` build tag, so every other
      # job in this file skips it: `go vet ./...` and `go test ./...` see a
      # package with no files for their platform and move on. Without this step
      # a change that breaks it is invisible here and surfaces on the website,
      # which is the wrong repository to find it in.
      - name: build the browser target
        run: |
          set -euo pipefail
          GOOS=js GOARCH=wasm go vet ./cmd/headroom-wasm
          GOOS=js GOARCH=wasm go build -trimpath -o /dev/null ./cmd/headroom-wasm
          echo "ok js/wasm"

  fuzz:
    name: fuzz the parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The plan JSON is the one input this tool does not produce itself: it
      # arrives from a customer's repository. Every other job runs the seed
      # corpus as ordinary tests; this is the only place mutation actually
      # happens. Short on a pull request so it does not become the reason
      # nobody merges, and if it ever finds something the crasher is uploaded
      # rather than lost with the runner.
      - name: fuzz Parse
        run: go test -run=NONE -fuzz=FuzzParse -fuzztime=90s ./internal/plan

      - name: fuzz Base
        run: go test -run=NONE -fuzz=FuzzBase -fuzztime=30s ./internal/plan

      - name: upload any crasher
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: internal/plan/testdata/fuzz/
          retention-days: 30

  action-refs:
    name: action refs resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `goreleaser check` validates the release config and says nothing about
      # whether the release workflow's own actions exist. That gap is not
      # theoretical: sigstore/cosign-installer publishes v4.x releases but no
      # floating v4 tag, and ossf/scorecard-action publishes no floating major
      # at all. Either one only fails on the job that uses it, and for the
      # release workflow that means at tag time, which is the one moment where
      # the only fix is a second tag.
      - name: every `uses:` must resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          missing=0
          refs=$(grep -rhoE '^\s*-?\s*uses:\s*[^ #]+' .github/workflows/ \
                 | sed -E 's/.*uses:\s*//' | sort -u)
          for ref in $refs; do
            case "$ref" in
              ./*|docker://*) echo "skip   $ref"; continue ;;
            esac
            repo=$(printf '%s' "${ref%%@*}" | cut -d/ -f1,2)
            tag=${ref##*@}
            if gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha >/dev/null 2>&1 ||
               gh api "repos/$repo/git/ref/heads/$tag" --jq .object.sha >/dev/null 2>&1 ||
               gh api "repos/$repo/commits/$tag" --jq .sha >/dev/null 2>&1; then
              echo "ok     $ref"
            else
              echo "MISSING $ref"
              missing=1
            fi
          done
          exit $missing

  goreleaser-config:
    name: goreleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Catches a broken release config on the pull request instead of on the
      # tag, where the only fix is a second tag.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
