name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A dependency is not vulnerable on the day you merge it, it becomes
    # vulnerable later. A weekly run is what turns "we scanned it once" into
    # "we are still scanning it".
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # govulncheck is symbol-level, not version-level: it reports an advisory
      # only when a code path actually reaches the vulnerable function. That is
      # the difference between a real finding and a dependency-graph rumour.
      - name: scan
        run: govulncheck ./...

      - name: scan again for the security tab
        if: always()
        run: govulncheck -format sarif ./... > govulncheck.sarif

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  scorecard:
    name: openssf scorecard
    runs-on: ubuntu-latest
    # A fork has neither the token nor a reason to publish a score.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Pinned to an exact tag because this action publishes no floating major:
      # ossf/scorecard-action@v2 does not resolve.
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing is what makes the score checkable by somebody who does
          # not work here, which is the entire point of running it.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # Blocks a pull request that would add a dependency carrying a known
      # advisory, before it is ever merged.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
          comment-summary-in-pr: always
